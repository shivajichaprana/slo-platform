# What a change to this repository has to survive.
#
# The gates are split by what they would tell you, not by which tool runs
# them: a specification that no longer validates, a generator whose arithmetic
# changed, a policy that no longer refers to objectives that exist, and
# Terraform that no longer parses are four different repairs, and a single
# job that runs all four reports only the first.
#
# Actions are pinned to a commit, not to a tag. A tag is a moving reference
# that the publisher can repoint, so a pinned tag is a supply chain that
# changes without a commit here; the readable version is in the comment
# beside each one.
name: slo-platform-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push supersedes the first: the only run worth finishing is the one
# that describes the current tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # The specifications themselves. --strict, because every warning this tool
  # emits describes an alert policy that deploys and reports the wrong thing,
  # and a warning nobody has to act on is a warning nobody reads.
  # ---------------------------------------------------------------------------
  specifications:
    name: validate specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate every specification
        run: python tools/validate-specs.py specs --strict
      - name: Validate the shipped example on its own
        run: python tools/validate-specs.py specs/example.yaml --strict
      - name: Confirm the JSON report is parseable on its own
        run: |
          python tools/validate-specs.py specs --json 2>/dev/null \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["facts"], d'

  # ---------------------------------------------------------------------------
  # The suite. Separated from the lint job because a failing assertion and a
  # long line are not the same news.
  # ---------------------------------------------------------------------------
  tests:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor is the version `required_version` and the type syntax in
        # these modules imply; the ceiling is what a contributor is likely to
        # have installed. Both are run because the suite is the only thing
        # standing between the two.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run the suite
        env:
          PYTHONPATH: tests
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t tests --verbose

  # ---------------------------------------------------------------------------
  # Generation. A plan that cannot be rendered is a specification nobody can
  # deploy, and it is invisible to the validator: the arithmetic is legal and
  # the artifact is the thing that does not exist.
  # ---------------------------------------------------------------------------
  generate:
    name: render artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      # Deliberately not --strict. The generator's warnings describe what a
      # burn-rate policy cannot see -- the band of slow burns below its lowest
      # threshold, chiefly -- which is a property of the objective the author
      # chose, not a fault introduced by the change under test. Failing on
      # them would make the gate unpassable for a correct single-tier policy.
      - name: Render the budget report
        run: python generator/render.py specs --render report --out generated/report
      - name: Render the alerting rules
        run: python generator/render.py specs --render prometheus --out generated/rules
      - name: Confirm every rule file parses as YAML
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          files = sorted(pathlib.Path("generated/rules").glob("*.yaml"))
          if not files:
              sys.exit("no rule file was rendered")
          for path in files:
              document = yaml.safe_load(path.read_text(encoding="utf-8"))
              rules = [r for g in document["groups"] for r in g["rules"]]
              if not rules:
                  sys.exit(f"{path}: rendered with no rules")
              for rule in rules:
                  # An unsubstituted placeholder is accepted by the parser and
                  # rejected by Prometheus, so it is checked here rather than
                  # discovered at load time.
                  if "$window" in rule["expr"] or "@{" in rule["expr"]:
                      sys.exit(f"{path}: {rule['alert']} carries an unsubstituted placeholder")
          print(f"{len(files)} rule file(s), {len(rules)} rule(s) in the last one")
          PY
      - name: Confirm the plan document is parseable on its own
        run: |
          python generator/render.py specs --json 2>/dev/null \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["plans"], d'

  # ---------------------------------------------------------------------------
  # The policy, audited against the specifications in the same checkout. The
  # one fault this catches that nothing else does is a gate naming an
  # objective no document defines: at run time such a gate has no condition to
  # evaluate, so its failure direction silently decides every deployment.
  # ---------------------------------------------------------------------------
  policy:
    name: audit error-budget policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Audit the policy against the objectives it governs
        run: python policy/budget.py specs --rules policy/rules.yaml --strict

  # ---------------------------------------------------------------------------
  # Lint. Line length matches the longest line the existing modules use, so
  # the gate describes this repository rather than a default.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pyflakes
        run: python -m pyflakes $(git ls-files '*.py')
      # Both of these read a committed configuration rather than taking their
      # limits from this file, so the gate and a local run cannot disagree.
      - name: flake8
        run: python -m flake8 $(git ls-files '*.py')
      - name: yamllint
        run: python -m yamllint --strict $(git ls-files '*.yaml' '*.yml')

  # ---------------------------------------------------------------------------
  # Terraform. No credentials and no backend: `validate` needs the providers
  # but not an account, so `init -backend=false` is the whole setup and
  # nothing here can reach a real deployment.
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.1.0
        with:
          tflint_version: v0.54.0
      - name: tflint
        run: |
          tflint --init
          tflint --format compact

  # ---------------------------------------------------------------------------
  # One required check. Without it a branch protection rule has to name every
  # job above, and a job added here is then ungated until somebody remembers
  # to add it there too. `always()` matters: without it a cancelled or skipped
  # dependency leaves this job skipped, which several UIs read as passing.
  # ---------------------------------------------------------------------------
  ci:
    name: ci complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [specifications, tests, generate, policy, lint, terraform]
    if: always()
    steps:
      - name: Report the state of every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failed = sorted(
              name for name, job in results.items() if job.get("result") != "success"
          )
          for name in sorted(results):
              print("{:>12}  {}".format(results[name].get("result"), name))
          if failed:
              sys.exit("not successful: " + ", ".join(failed))
          print("every gate passed")
          PY
